name: Backend CI

on:
  push:
    branches:
      - gop-base-web
      - '007-**'
  pull_request:
    branches:
      - gop-base-web

jobs:
  build-test:
    name: Build and test (.NET 10)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore GOP.slnx

      - name: Build (Release, no restore)
        run: dotnet build GOP.slnx --configuration Release --no-restore

      - name: Run tests (Release, no build)
        run: dotnet test GOP.slnx --configuration Release --no-build --verbosity normal
