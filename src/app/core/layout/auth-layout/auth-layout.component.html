<div class="flex h-screen w-full">
  <!-- Panel Izquierdo — Marca (1/3), oculto en móvil -->
  <div
    class="hidden lg:flex w-1/3 relative bg-cover bg-center"
    [style.background-image]="'url(' + loginBgUrl + ')'"
  >
    <!-- Overlay azul navy -->
    <div class="absolute inset-0 bg-[var(--sidebar-bg)]/80"></div>

    <!-- Contenido del panel izquierdo -->
    <div class="relative z-10 flex flex-col justify-end p-10 pb-16">
      <span class="block w-12 h-1 bg-[var(--color-accent)] mb-6"></span>
      <h1 class="text-[var(--color-text-inverse)] text-3xl font-bold leading-tight mb-3">
        {{ locale.welcome }}
      </h1>
      <p class="text-[var(--color-text-secondary)] text-sm leading-relaxed">
        {{ locale.subtitle }}
      </p>
    </div>
  </div>

  <!-- Panel Derecho — Contenido (2/3, 100% en móvil) -->
  <div class="flex flex-col w-full lg:w-2/3 bg-[var(--color-surface)] px-8 sm:px-12 lg:px-16 py-6">
    <!-- Contenido central (logo + formulario) — centrado vertical -->
    <div class="flex-1 flex items-center py-8">
      <div class="w-full max-w-sm">
        <!-- Logo institucional -->
        <img
          src="assets/icons/login-logo.png"
          alt="Logo institucional"
          class="h-[4.75rem] object-contain object-left mb-8"
        />
        <router-outlet />
      </div>
    </div>

    <!-- Pie del panel -->
    <div class="shrink-0">
      <span class="text-xs text-[var(--color-text-secondary)]">{{ locale.version }}</span>
    </div>
  </div>
</div>
