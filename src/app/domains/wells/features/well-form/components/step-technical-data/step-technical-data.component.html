<div [formGroup]="formGroup()" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">

  <!-- Tipo de Trayectoria -->
  <div class="flex flex-col gap-1">
    <label class="text-sm font-medium text-text-primary" for="tipoTrayectoria">
      {{ locale.fields.tipoTrayectoria }} <span class="text-error">*</span>
    </label>
    <p-select
      inputId="tipoTrayectoria"
      formControlName="tipoTrayectoria"
      [options]="tipoTrayectoriaOpts()"
      optionLabel="label"
      optionValue="value"
      [placeholder]="locale.placeholders.selectTipoTrayectoria"
      styleClass="w-full"
      data-testid="select-tipoTrayectoria"
    />
    @if (isFieldInvalid('tipoTrayectoria')) {
      <p-message severity="error" [text]="locale.errors.required" styleClass="text-xs" />
    }
  </div>
