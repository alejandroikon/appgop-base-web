<div class="flex flex-col gap-2 p-3 rounded-lg border border-border bg-surface-alt"
     data-testid="well-name-preview">

  <span class="text-xs font-semibold text-text-secondary uppercase tracking-wide">
    {{ locale.title }}
  </span>

  @if (loading()) {
    <div class="flex items-center gap-2">
      <p-progressSpinner
        styleClass="w-5 h-5"
        strokeWidth="4"
        data-testid="preview-spinner"
      />
      <span class="text-sm text-text-secondary">{{ locale.checking }}</span>
    </div>
  } @else if (nombrePozo()) {
    <div class="flex items-center gap-3 flex-wrap">
      <span class="text-base font-semibold text-text-primary" data-testid="preview-name">
        {{ nombrePozo() }}
      </span>
      @if (available() === true) {
        <p-tag
          [value]="locale.available"
          severity="success"
          data-testid="preview-badge-available"
        />
      } @else if (available() === false) {
        <p-tag
          [value]="locale.unavailable"
          severity="danger"
          data-testid="preview-badge-unavailable"
        />
      }
    </div>
  } @else {
    <span class="text-sm text-text-secondary italic" data-testid="preview-placeholder">
      {{ locale.placeholder }}
    </span>
  }

</div>
