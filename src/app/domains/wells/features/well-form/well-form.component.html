<p-toast />

@if (isLoading()) {
  <div class="flex justify-center items-center h-64">
    <p-progressSpinner />
  </div>
} @else {
  <div class="flex flex-col gap-4">

    <!-- Encabezado -->
    <div class="flex items-center justify-between">
      <h1 class="text-2xl font-semibold text-text-primary">
        {{ isEditMode() ? locale.titleEdit : locale.titleCreate }}
      </h1>
    </div>

    <!-- ─── Stepper ───────────────────────────────────────────────────────── -->
    <p-stepper
      [value]="activeStep()"
      (valueChange)="activeStep.set($event ?? 1)"
      [linear]="true"
      data-testid="well-form-stepper"
    >
      <!-- ─── Paso 1: Información del Contrato ─────────────────────────── -->
      <p-step-panel [value]="1">
        <ng-template #content let-activateCallback="activateCallback">
          <div class="flex flex-col gap-6">
            <p class="text-lg font-semibold text-text-primary">{{ locale.steps.contractInfo }}</p>

            <app-step-contract-info
              [formGroup]="wellForm"
              [contratos]="contratos()"
              [campos]="campos()"
              [clusters]="clusters()"
              [clasificacionOpts]="clasificacionOpts"
              [cuenca]="cuencaDisplay()"
              [tipoContrato]="tipoContratoDisplay()"
              [namePreview]="namePreview()"
              [namePreviewLoading]="namePreviewLoading()"
              (contratoChanged)="onContratoChanged($event)"
              (campoChanged)="onCampoChanged($event)"
            />

            <!-- Botones de paso 1 -->
            <div class="flex justify-between gap-3 pt-2">
              <p-button
                type="button"
                [label]="locale.actions.cancel"
                severity="secondary"
                [outlined]="true"
                (onClick)="onCancel()"
                data-testid="btn-cancel"
              />
              <p-button
                type="button"
                [label]="locale.actions.next"
                [disabled]="!isStep1Valid()"
                (onClick)="nextStep()"
                data-testid="btn-next-step1"
              />
            </div>
          </div>
        </ng-template>
      </p-step-panel>

      <!-- ─── Paso 2: Datos Técnicos ───────────────────────────────────── -->
      <p-step-panel [value]="2">
        <ng-template #content>
          <div class="flex flex-col gap-6">
            <p class="text-lg font-semibold text-text-primary">{{ locale.steps.technicalData }}</p>

            <app-step-technical-data
              [formGroup]="wellForm"
              [tipoTrayectoriaOpts]="tipoTrayectoriaOpts"
              [tipoUbicacionOpts]="tipoUbicacionOpts"
              [tipoAnguloOpts]="tipoAnguloOpts"
              [tipoObjetivoOpts]="tipoObjetivoOpts"
              [tipoTerminacionOpts]="tipoTerminacionOpts"
            />

            <!-- Botones de paso 2 -->
            <div class="flex justify-between gap-3 pt-2">
              <p-button
                type="button"
                [label]="locale.actions.previous"
                severity="secondary"
                [outlined]="true"
                (onClick)="prevStep()"
                data-testid="btn-prev-step2"
              />
              <p-button
                type="button"
                [label]="locale.actions.next"
                [disabled]="!isStep2Valid()"
                (onClick)="nextStep()"
                data-testid="btn-next-step2"
              />
            </div>
          </div>
        </ng-template>
      </p-step-panel>

      <!-- ─── Paso 3: Ubicación Geográfica ────────────────────────────── -->
      <p-step-panel [value]="3">
        <ng-template #content>
          <div class="flex flex-col gap-6">
            <p class="text-lg font-semibold text-text-primary">{{ locale.steps.location }}</p>

            <app-step-location
              [formGroup]="wellForm"
              [departamentos]="departamentos()"
              [municipios]="municipios()"
              (departamentoChanged)="onDepartamentoChanged($event)"
            />

            <!-- Botones de paso 3 -->
            <div class="flex justify-between gap-3 pt-2">
              <p-button
                type="button"
                [label]="locale.actions.previous"
                severity="secondary"
                [outlined]="true"
                (onClick)="prevStep()"
                data-testid="btn-prev-step3"
              />
              <p-button
                type="button"
                [label]="locale.actions.next"
                [disabled]="!isStep3Valid()"
                (onClick)="nextStep()"
                data-testid="btn-next-step3"
              />
            </div>
          </div>
        </ng-template>
      </p-step-panel>

      <!-- ─── Paso 4: Resumen y Confirmación ──────────────────────────── -->
      <p-step-panel [value]="4">
        <ng-template #content>
          <div class="flex flex-col gap-6">
            <p class="text-lg font-semibold text-text-primary">{{ locale.steps.summary }}</p>

            <app-step-summary
              [formData]="summaryFormData()"
              [cuenca]="cuencaDisplay()"
              [tipoContrato]="tipoContratoDisplay()"
              [nombrePozo]="summaryNombrePozo()"
              [contratoNombre]="summaryContratoNombre()"
              [campoNombre]="summaryCampoNombre()"
              [departamentoNombre]="summaryDepartamentoNombre()"
              [municipioNombre]="summaryMunicipioNombre()"
              [clusterNombre]="summaryClusterNombre()"
            />

            <!-- Botones de paso 4 -->
            <div class="flex justify-between gap-3 pt-2">
              <p-button
                type="button"
                [label]="locale.actions.previous"
                severity="secondary"
                [outlined]="true"
                (onClick)="prevStep()"
                data-testid="btn-prev-step4"
              />
              <p-button
                type="button"
                [label]="locale.actions.saveDraft"
                [loading]="isSaving()"
                [disabled]="!canSave()"
                (onClick)="onSubmit()"
                data-testid="btn-submit"
              />
            </div>
          </div>
        </ng-template>
      </p-step-panel>

    </p-stepper>

  </div>
}
